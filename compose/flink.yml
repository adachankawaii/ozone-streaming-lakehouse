services:
  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: ozone-lakehouse-flink:2.1.3
    hostname: flink-jobmanager
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
      s3g:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.bind-host: 0.0.0.0
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        parallelism.default: 2
    volumes:
      - ./flink/config/init.sql:/opt/flink/conf/init.sql:ro
      - ./flink/config/smoke.sql:/opt/flink/conf/smoke.sql:ro
    networks:
      - lakehouse_net
    restart: unless-stopped

  flink-taskmanager:
    image: ozone-lakehouse-flink:2.1.3
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_started
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.bind-host: 0.0.0.0
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
    networks:
      - lakehouse_net
    restart: unless-stopped
